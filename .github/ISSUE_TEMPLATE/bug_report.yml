name: Bug report
description: Report a reproducible problem using synthetic, redacted data.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Do not include credentials, personal details, or live referral links."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a local instance and synthetic data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/version, Node and pnpm versions, OS, browser, and local or self-hosted setup.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
